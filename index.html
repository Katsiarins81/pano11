<html>
<head>
  <link rel="stylesheet" href="https://cdn.pannellum.org/2.5/pannellum.css"/>
  <script type="text/javascript" src="https://cdn.pannellum.org/2.5/pannellum.js"></script>
  <style>
    #panorama { width: 600px; height: 400px; }
  </style>
</head>
<body>
  <div id="panorama"></div>
  <script>
    pannellum.viewer('panorama', {
      type: "equirectangular",
      panorama: "https://img.magnific.com/free-photo/art-rural-landscape-field-grass-summer-time-country-side_181624-12750.jpg?semt=ais_hybrid&w=740&q=80",
      autoLoad: true,
      compass: true,
      title: "My Virtual Tour",
      author: "Your Name"
    });
  </script>
</body>
</html>
