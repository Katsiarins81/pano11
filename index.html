<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdn.pannellum.org/2.5/pannellum.css"/>
  <script type="text/javascript" src="https://cdn.pannellum.org/2.5/pannellum.js"></script>
  <style>
    #panorama { width: 100vw; height: 100vh; }
    body { margin: 0; }
    .pnlm-panorama-info {
       display: none !important;
    }
  </style>
</head>
<body>
  <!-- Красный блок карты -->
  <div class="plan" style="width: 200px; height: 200px; background: red; position: absolute; top: 100px; left: 100px; z-index: 100;"></div>
  
  <div id="panorama"></div>

  <!-- Модальное окно для третьей метки -->
  <div id="customModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:999; align-items:center; justify-content:center;">
    <div style="background:#fff; padding:20px; border-radius:8px; max-width:400px; text-align:center; font-family:sans-serif;">
      <h3 id="modalTitle">Заголовок</h3>
      <p id="modalText">Описание объекта</p>
      <button onclick="document.getElementById('customModal').style.display='none'">Закрыть</button>
    </div>
  </div>

  <script>
    // 1. Сначала объявляем функцию для модального окна
    function openModal(event, args) {
      document.getElementById('modalTitle').innerText = args.title;
      document.getElementById('modalText').innerText = args.description;
      document.getElementById('customModal').style.display = 'flex';
    }

    // 2. Инициализируем плеер ОДИН раз со всеми объединенными настройками
    pannellum.viewer('panorama', {
      type: "equirectangular",
      panorama: "./444.jpg",
      autoLoad: true,
      compass: true,
      title: "My Virtual Tour",
      author: "Your Name",
      
      // Настройки отображения для формата 1:3
      haov: 360,
      vaov: 120,
      avoidShowingBackground: true,
      minPitch: -60,
      maxPitch: 60,
      minYaw: -170, 
      maxYaw: 170,  
      maxHfov: 90,
      hfov: 80,

      // Настройки для удобного определения координат (удалите/выключите после настройки)
      hotSpotDebug: true,
      //draggable: false,

      // Весь массив меток теперь находится внутри конфигурации плеера
      hotSpots: [
        {
          // 1. Всплывающая текстовая подсказка при наведении
          pitch: 5,
          yaw: 10,
          type: "info",
          text: "Всплывающая подсказка при наведении курсора"
        },
        {
          // 2. Метка со ссылкой на другой сайт или страницу
          pitch: -10,
          yaw: 45,
          type: "info",
          text: "Перейти на сайт (откроется в новой вкладке)",
          URL: "https://example.com"
        },
        {
          // 3. Метка, открывающая всплывающее модальное окно по клику
          pitch: 0,
          yaw: -30,
          type: "info",
          text: "Нажмите, чтобы открыть карточку",
          clickHandlerFunc: openModal,
          clickHandlerArgs: {
            title: "Название локации",
            description: "Здесь может быть подробный текст, фото, кнопка заказа или схема проезда."
          }
        }
      ]
    });
  </script>
</body>
</html>
