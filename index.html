<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdn.pannellum.org/2.5/pannellum.css"/>
  <script type="text/javascript" src="https://cdn.pannellum.org/2.5/pannellum.js"></script>
  <style>
    #panorama { width: 100vw; height: 100vh; }
    body { margin: 0; }
    .pnlm-panorama-info {
       display: none !important;
    }
  </style>
</head>
<body>
  <div class="plan" style="width: 200px; height: 200px; background: red; position: absolute; top: 100px; left: 100px; z-index: 100;"></div>
  
  <div id="panorama"></div>
  <script>
    pannellum.viewer('panorama', {
      type: "equirectangular",
      panorama: "./444.jpg",
      autoLoad: true,
      haov: 360,
      vaov: 120,
      
      // 1. Запрещаем показывать черный фон за пределами фото
      avoidShowingBackground: true,
      
      // 2. Ограничиваем угол наклона камеры ровно половиной от vaov (120 / 2 = 60)
      minPitch: -60,
      maxPitch: 60,
      
      // 3. Ограничиваем максимальное отдаление (зум), чтобы на широком экране не вылезали края
      maxHfov: 90,
      hfov: 80,
      
      compass: true,
      title: "My Virtual Tour",
      author: "Your Name"
    });


    ///
    pannellum.viewer('panorama', {
  type: "equirectangular",
  panorama: "./444.jpg",
  autoLoad: true,
  haov: 360,
  vaov: 120,
  avoidShowingBackground: true,

  // Ограничение по вертикали (верх/низ)
  minPitch: -60,
  maxPitch: 60,

  // Ограничение по горизонтали (чтобы не доходить до стыка на ±180°)
  minYaw: -170, // Максимальный поворот влево (от -180 до 0)
  maxYaw: 170,  // Максимальный поворот вправо (от 0 до 180)

  maxHfov: 90,
  hfov: 80
});
    //
     // Массив меток (хотспотов)
    hotSpots: [
      {
        // 1. Всплывающая текстовая подсказка при наведении
        pitch: 5,
        yaw: 10,
        type: "info",
        text: "Всплывающая подсказка при наведении курсора"
      },
      {
        // 2. Метка со ссылкой на другой сайт или страницу
        pitch: -10,
        yaw: 45,
        type: "info",
        text: "Перейти на сайт (откроется в новой вкладке)",
        URL: "https://example.com"
      },
      {
        // 3. Метка, открывающая красивое всплывающее модальное окно по клику
        pitch: 0,
        yaw: -30,
        type: "info",
        text: "Нажмите, чтобы открыть карточку",
        clickHandlerFunc: openModal,
        clickHandlerArgs: {
          title: "Название локации",
          description: "Здесь может быть подробный текст, фото, кнопка заказа или схема проезда."
        }
      }
    ]
    //
    hotSpotDebug: true;
  </script>
</body>
</html>
