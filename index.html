<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdn.pannellum.org/2.5/pannellum.css"/>
  <script type="text/javascript" src="https://cdn.pannellum.org/2.5/pannellum.js"></script>
  <style>
    #panorama { width: 100vw; height: 100vh; }
    body { margin: 0; }
    .pnlm-panorama-info {
       display: none !important;
    }

    /* Стили для карусели */
    .carousel-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      margin: 15px auto;
      overflow: hidden;
    }
    .carousel-slide {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: none; /* Прячем все картинки по умолчанию */
      border-radius: 4px;
    }
    .carousel-slide.active {
      display: block; /* Показываем только текущую картинку */
    }
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      border-radius: 50%;
    }
    .carousel-btn:hover {
      background: #000;
    }
    .carousel-prev { left: 10px; }
    .carousel-next { right: 10px; }
  </style>
</head>
<body>
  <!-- Красный блок карты -->
  <div class="plan" style="width: 200px; height: 200px; background: red; position: absolute; top: 100px; left: 100px; z-index: 100;"></div>
  
  <div id="panorama"></div>

  <!-- Обновленное модальное окно с каруселью -->
  <div id="customModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:999; align-items:center; justify-content:center;">
    <div style="background:#fff; padding:20px; border-radius:8px; width:90%; max-width:400px; text-align:center; font-family:sans-serif; position:relative;">
      <h3 id="modalTitle">Заголовок</h3>
      <p id="modalText"></p>
      
      <!-- Блок карусели -->
      <div class="carousel-container">
        <div id="carouselImages"></div>
        <button class="carousel-btn carousel-prev" onclick="changeSlide(-1)">&#10094;</button>
        <button class="carousel-btn carousel-next" onclick="changeSlide(1)">&#10095;</button>
      </div>

      <button onclick="document.getElementById('customModal').style.display='none'" style="margin-top:10px; padding: 8px 20px; cursor:pointer;">Закрыть</button>
    </div>
  </div>

  <script>
    let currentSlideIndex = 0;
    let totalSlides = 0;

    // 1. Функция открытия модального окна и генерации карусели
    function openModal(event, args) {
      const titleEl = document.getElementById('modalTitle');
      const textEl = document.getElementById('modalText');
      const imagesContainer = document.getElementById('carouselImages');

      if (titleEl) titleEl.innerText = args.title;
      if (textEl) textEl.innerText = args.description || "";
      
      // Очищаем старые картинки из карусели
      imagesContainer.innerHTML = "";
      currentSlideIndex = 0;
      totalSlides = args.images.length;

      // Генерируем теги <img> для переданного массива картинок
      args.images.forEach((imgUrl, index) => {
        const img = document.createElement('img');
        img.src = imgUrl;
        img.className = 'carousel-slide';
        if (index === 0) img.classList.add('active'); // Первой картинке даем класс active
        imagesContainer.appendChild(img);
      });

      // Показываем кнопки управления, только если картинок больше одной
      const prevBtn = document.querySelector('.carousel-prev');
      const nextBtn = document.querySelector('.carousel-next');
      if (totalSlides <= 1) {
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
      } else {
        prevBtn.style.display = 'block';
        nextBtn.style.display = 'block';
      }

      document.getElementById('customModal').style.display = 'flex';
    }

    // 2. Функция переключения слайдов (вперед/назад)
    function changeSlide(direction) {
      const slides = document.querySelectorAll('.carousel-slide');
      if (slides.length === 0) return;

      // Снимаем класс active с текущего слайда
      slides[currentSlideIndex].classList.remove('active');

      // Вычисляем индекс нового слайда по кругу
      currentSlideIndex = (currentSlideIndex + direction + totalSlides) % totalSlides;

      // Добавляем класс active новому слайду
      slides[currentSlideIndex].classList.add('active');
    }

    // 3. Инициализируем плеер
    pannellum.viewer('panorama', {
      type: "equirectangular",
      panorama: "./444.jpg",
      autoLoad: true,
      compass: true,
      title: "My Virtual Tour",
      author: "Your Name",
      
      haov: 360,
      vaov: 120,
      avoidShowingBackground: true,
      minPitch: -60,
      maxPitch: 60,
      minYaw: -170, 
      maxYaw: 170,  
      maxHfov: 90,
      hfov: 80,
      hotSpotDebug: true,

      hotSpots: [
        {
          pitch: 5,
          yaw: 10,
          type: "info",
          text: "Всплывающая подсказка"
        },
        {
          pitch: 3.9,
          yaw: -145,
          type: "info",
          text: "Нажмите, чтобы открыть карусель",
          clickHandlerFunc: openModal,
          clickHandlerArgs: {
            title: "Коллекция вышиванок",
            description: "Ниже представлены фотографии экспонатов:",
            // ВАЖНО: Передаем массив картинок для карусели этой метки
            images: [
              "img1.jpg",
              "img2.jpg",
              "img3.jpg"
            ]
          }
        }
      ]
    });
  </script>
</body>
</html>
