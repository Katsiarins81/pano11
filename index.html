<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdn.pannellum.org/2.5/pannellum.css"/>
  <script type="text/javascript" src="https://cdn.pannellum.org/2.5/pannellum.js"></script>
  <style>
    #panorama { width: 100vw; height: 100vh; }
    body { margin: 0; }
    .pnlm-panorama-info {
       display: none !important;
    }
  </style>
</head>
<body>
  <div class="plan" style="width: 200px; height: 200px; background: red; position: absolute; top: 100px; left: 100px; z-index: 100;"></div>
  
  <div id="panorama"></div>
  <script>
    pannellum.viewer('panorama', {
      type: "equirectangular",
      panorama: "./333.jpg",
      autoLoad: true,
      haov: 360,
      vaov: 120,
      
      // 1. Запрещаем показывать черный фон за пределами фото
      avoidShowingBackground: true,
      
      // 2. Ограничиваем угол наклона камеры ровно половиной от vaov (120 / 2 = 60)
      minPitch: -60,
      maxPitch: 60,
      
      // 3. Ограничиваем максимальное отдаление (зум), чтобы на широком экране не вылезали края
      maxHfov: 90,
      hfov: 80,
      
      compass: true,
      title: "My Virtual Tour",
      author: "Your Name"
    });
  </script>
</body>
</html>
